services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fusebox
      POSTGRES_USER: fusebox
      POSTGRES_PASSWORD: fusebox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

