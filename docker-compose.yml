services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fusebox
      POSTGRES_USER: fusebox
      POSTGRES_PASSWORD: fusebox
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusebox -d fusebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fusebox
      DB_USERNAME: fusebox
      DB_PASSWORD: fusebox
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
