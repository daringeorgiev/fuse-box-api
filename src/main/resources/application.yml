server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fusebox}
    username: ${DB_USERNAME:fusebox}
    password: ${DB_PASSWORD:fusebox}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require

---
spring:
  config:
    activate:
      on-profile: dev

debug: true

logging:
  level:
    org.flywaydb: DEBUG
