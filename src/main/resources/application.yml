server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fusebox}
    username: ${DB_USERNAME:fusebox}
    password: ${DB_PASSWORD:fusebox}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

debug: true

logging:
  level:
    org.flywaydb: DEBUG
